[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "erutor"
version = "0.1.0"
description = "A lightweight movie & TV show metadata fetcher and NFO generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
erutor = "erutor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
